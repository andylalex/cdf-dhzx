<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>订单详情</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f5;
    color: #333;
    -webkit-font-smoothing: antialiased;
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* 顶部导航 */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav-back {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-back svg { width: 20px; height: 20px; }
  .nav-title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .nav-placeholder { width: 24px; }

  /* 状态栏 */
  .status-bar {
    background: #b7141b;
    margin: 0 16px 10px;
    border-radius: 10px;
    padding: 16px;
    color: #fff;
  }
  .status-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .status-desc {
    font-size: 13px;
    opacity: 0.95;
    line-height: 1.4;
  }

  /* 卡片通用 */
  .card {
    background: #fff;
    border-radius: 10px;
    margin: 0 16px 10px;
    padding: 16px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 12px;
  }

  /* 商品信息 */
  .product-card {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .product-img {
    width: 80px; height: 80px;
    background: #f5f5f5;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-info { flex: 1; min-width: 0; }
  .product-name {
    font-size: 15px;
    color: #1a1a1a;
    line-height: 1.4;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .product-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .product-tag {
    font-size: 11px;
    color: #999;
    background: #f5f5f5;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .product-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .product-qty {
    font-size: 13px;
    color: #999;
  }
  .product-price {
    font-size: 16px;
    font-weight: 700;
    color: #b7141b;
  }

  /* 使用凭证 */
  .voucher-section {
    text-align: center;
  }
  .qr-code {
    width: 160px;
    height: 160px;
    margin: 0 auto 12px;
    background: #f5f5f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qr-code img { width: 100%; height: 100%; object-fit: contain; }
  .voucher-code-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .voucher-code {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 2px;
  }
  .copy-icon {
    width: 18px;
    height: 18px;
    cursor: pointer;
    color: #999;
  }
  .voucher-expire {
    font-size: 13px;
    color: #999;
    margin-bottom: 14px;
  }
  .refund-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 13px;
    color: #666;
    background: #fff;
    cursor: pointer;
  }

  /* 适用门店 */
  .store-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .store-info { flex: 1; min-width: 0; }
  .store-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .store-name {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .store-status {
    font-size: 11px;
    color: #52c41a;
    background: #f6ffed;
    border: 1px solid #b7eb8f;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .store-time {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
  }
  .store-address {
    font-size: 13px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .store-distance {
    font-size: 12px;
    color: #999;
  }
  .store-phone {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #fff5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .store-phone svg {
    width: 20px;
    height: 20px;
    color: #b7141b;
  }

  /* 订单信息 */
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .info-row:last-child { margin-bottom: 0; }
  .info-label { color: #999; }
  .info-value { color: #666; }
  .info-value.copy {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .info-value.copy svg {
    width: 14px;
    height: 14px;
    color: #999;
  }

  /* 联系我们 */
  .contact-section {
    text-align: center;
    padding: 12px 16px;
  }
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: #666;
    background: none;
    border: none;
    cursor: pointer;
  }
  .contact-btn svg {
    width: 18px;
    height: 18px;
    color: #666;
  }

  /* 费用明细 */
  .fee-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .fee-row:last-child { margin-bottom: 0; }
  .fee-label { color: #999; }
  .fee-value { color: #666; }
  .fee-row.total {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #eee;
  }
  .fee-row.total .fee-value {
    font-size: 16px;
    font-weight: 700;
    color: #b7141b;
  }

  /* 底部安全区 */
  .safe-bottom { height: env(safe-area-inset-bottom); }
</style>
</head>
