<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>订单详情</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f5;
    color: #333;
    -webkit-font-smoothing: antialiased;
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* 顶部导航 */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav-back {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-back svg { width: 20px; height: 20px; }
  .nav-title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .nav-placeholder { width: 24px; }

  /* 状态栏 */
  .status-bar {
    background: #b7141b;
    margin: 0 16px 10px;
    border-radius: 10px;
    padding: 16px;
    color: #fff;
  }
  .status-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .status-desc {
    font-size: 13px;
    opacity: 0.95;
    line-height: 1.4;
  }

  /* 卡片通用 */
  .card {
    background: #fff;
    border-radius: 10px;
    margin: 0 16px 10px;
    padding: 16px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 12px;
  }

  /* 商品信息 */
  .product-card {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .product-img {
    width: 80px; height: 80px;
    background: #f5f5f5;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-info { flex: 1; min-width: 0; }
  .product-name {
    font-size: 15px;
    color: #1a1a1a;
    line-height: 1.4;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .product-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .product-tag {
    font-size: 11px;
    color: #999;
    background: #f5f5f5;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .product-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .product-qty {
    font-size: 13px;
    color: #999;
  }
  .product-price {
    font-size: 16px;
    font-weight: 700;
    color: #b7141b;
  }

  /* 使用凭证 - 无二维码 */
  .voucher-section {
    text-align: center;
  }
  .voucher-code-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .voucher-code {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 2px;
  }
  .copy-icon {
    width: 18px;
    height: 18px;
    cursor: pointer;
    color: #999;
  }
  .voucher-expire {
    font-size: 13px;
    color: #999;
    margin-bottom: 14px;
  }
  .refund-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 13px;
    color: #666;
    background: #fff;
    cursor: pointer;
  }

  /* 使用说明 */
  .usage-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .usage-list li {
    font-size: 13px;
    color: #666;
    line-height: 1.8;
    position: relative;
    padding-left: 14px;
  }
  .usage-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ccc;
  }

  /* 订单信息 */
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .info-row:last-child { margin-bottom: 0; }
  .info-label { color: #999; }
  .info-value { color: #666; }
  .info-value.copy {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .info-value.copy svg {
    width: 14px;
    height: 14px;
    color: #999;
  }

  /* 联系我们 */
  .contact-section {
    text-align: center;
    padding: 12px 16px;
  }
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: #666;
    background: none;
    border: none;
    cursor: pointer;
  }
  .contact-btn svg {
    width: 18px;
    height: 18px;
    color: #666;
  }

  /* 费用明细 */
  .fee-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .fee-row:last-child { margin-bottom: 0; }
  .fee-label { color: #999; }
  .fee-value { color: #666; }
  .fee-row.total {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #eee;
  }
  .fee-row.total .fee-value {
    font-size: 16px;
    font-weight: 700;
    color: #b7141b;
  }

  /* 底部安全区 */
  .safe-bottom { height: env(safe-area-inset-bottom); }
</style>
</head>
<body>

<!-- 导航栏 -->
<div class="nav-bar">
  <div class="nav-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div class="nav-title">订单详情</div>
  <div class="nav-placeholder"></div>
</div>

<!-- 状态栏 -->
<div class="status-bar">
  <div class="status-title">已完成</div>
  <div class="status-desc">您的兑换订单已完成，优惠券已发放至账户</div>
</div>

<!-- 商品信息 -->
<div class="card">
  <div class="product-card">
    <div class="product-img">
      <img src="assets/product-5-voucher.jpg" alt="虚拟优惠券" onerror="this.style.display='none'">
    </div>
    <div class="product-info">
      <div class="product-name">CDF 100元代金券</div>
      <div class="product-tags">
        <span class="product-tag">线上自动抵扣</span>
        <span class="product-tag">不可提现</span>
      </div>
      <div class="product-meta">
        <span class="product-qty">×1</span>
        <span class="product-price">¥89.00</span>
      </div>
    </div>
  </div>
</div>

<!-- 使用说明 -->
<div class="card">
  <div class="card-title">使用说明</div>
  <ul class="usage-list">
    <li>下单时自动抵扣，无需手动输入券码</li>
    <li>仅限线上商城使用，不可用于线下门店</li>
    <li>每笔订单限用一张，不可与其他优惠券叠加</li>
    <li>优惠券不可提现、不找零、不开具发票</li>
  </ul>
</div>

<!-- 订单信息 -->
<div class="card">
  <div class="card-title">订单信息</div>
  <div class="info-row">
    <span class="info-label">订单编号</span>
    <span class="info-value copy">
      202604150003
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </span>
  </div>
  <div class="info-row">
    <span class="info-label">下单时间</span>
    <span class="info-value">2026-04-15 10:30:00</span>
  </div>
  <div class="info-row">
    <span class="info-label">订单状态</span>
    <span class="info-value">已完成</span>
  </div>
</div>

<!-- 联系我们 -->
<div class="card contact-section">
  <button class="contact-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    联系我们
  </button>
</div>

<!-- 费用明细 -->
<div class="card">
  <div class="card-title">费用明细</div>
  <div class="fee-row">
    <span class="fee-label">商品总价</span>
    <span class="fee-value">¥100.00</span>
  </div>
  <div class="fee-row">
    <span class="fee-label">积分抵扣</span>
    <span class="fee-value">-¥100.00</span>
  </div>
  <div class="fee-row total">
    <span class="fee-label">实付金额</span>
    <span class="fee-value">¥0.00</span>
  </div>
</div>

<div class="safe-bottom"></div>

</body>
</html>
