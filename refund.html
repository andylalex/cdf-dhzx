<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申请售后 - 中免海南商城</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 375px;
            min-height: 100vh;
            background: #f5f6f8;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(211, 47, 47, 0.2);
        }

        .nav-back {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .nav-back svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
        }

        /* 内容区 */
        .content {
            flex: 1;
            padding: 12px;
            padding-bottom: 80px;
            overflow-y: auto;
        }

        /* 订单信息卡片 */
        .order-card {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .order-card-title {
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .order-card-title::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 14px;
            background: linear-gradient(180deg, #D32F2F 0%, #FFA000 100%);
            border-radius: 2px;
            margin-right: 8px;
        }

        .order-item {
            display: flex;
            align-items: center;
        }

        .order-thumb {
            width: 72px;
            height: 72px;
            border-radius: 8px;
            background: linear-gradient(135deg, #FFE5B4 0%, #FFA000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 12px;
            overflow: hidden;
        }

        .order-thumb svg {
            width: 40px;
            height: 40px;
            fill: #fff;
        }

        .order-info {
            flex: 1;
            min-width: 0;
        }

        .order-name {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            line-height: 1.4;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .order-spec {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-qty {
            font-size: 13px;
            color: #666;
        }

        .order-price {
            font-size: 14px;
            color: #D32F2F;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .order-price .coin {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: linear-gradient(135deg, #FFA000 0%, #FF8F00 100%);
            color: #fff;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: 500;
        }

        /* 区块卡片 */
        .section-card {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 15px;
            background: linear-gradient(180deg, #D32F2F 0%, #FFA000 100%);
            border-radius: 2px;
            margin-right: 8px;
        }

        .section-title .required {
            color: #D32F2F;
            margin-left: 2px;
        }

        /* 退款原因列表 */
        .reason-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .reason-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }

        .reason-item:last-child {
            border-bottom: none;
        }

        .reason-radio {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1.5px solid #ddd;
            margin-right: 10px;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .reason-item.active .reason-radio {
            border-color: #D32F2F;
        }

        .reason-item.active .reason-radio::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
        }

        .reason-item.disabled .reason-radio {
            background: #f5f5f5;
            border-color: #e0e0e0;
        }

        .reason-item.disabled .reason-radio::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 8px;
            height: 4px;
            border-left: 1.5px solid #ccc;
            border-bottom: 1.5px solid #ccc;
            margin-top: -1px;
        }

        .reason-text {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .reason-item.disabled .reason-text {
            color: #999;
        }

        .reason-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .reason-custom-input {
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            background: #f5f5f5;
            transition: all 0.2s;
        }

        .reason-custom-input:disabled {
            color: #bbb;
            cursor: not-allowed;
        }

        .reason-custom-input:focus:not(:disabled) {
            border-color: #D32F2F;
            background: #fff;
        }

        .reason-tag.auto {
            background: #FFF3E0;
            color: #FF8F00;
        }

        .reason-tag.review {
            background: #E3F2FD;
            color: #1976D2;
        }

        .reason-tag.self {
            background: #E8F5E9;
            color: #388E3C;
        }

        /* 文本框 */
        .textarea-wrap {
            background: #f7f8fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 4px;
        }

        .refund-textarea {
            width: 100%;
            min-height: 90px;
            border: none;
            background: transparent;
            font-size: 14px;
            color: #333;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.6;
        }

        .refund-textarea::placeholder {
            color: #bbb;
        }

        .textarea-count {
            text-align: right;
            font-size: 12px;
            color: #bbb;
            margin-top: 4px;
        }

        /* 退款规则 callout */
        .rules-callout {
            background: linear-gradient(135deg, #FFF8E1 0%, #FFF3E0 100%);
            border-left: 3px solid #FFA000;
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 8px;
        }

        .callout-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .callout-icon {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .callout-icon svg {
            width: 100%;
            height: 100%;
            fill: #FFA000;
        }

        .callout-title {
            font-size: 13px;
            font-weight: 600;
            color: #FF8F00;
        }

        .callout-list {
            list-style: none;
            font-size: 12px;
            color: #6D5800;
            line-height: 1.8;
        }

        .callout-list li {
            position: relative;
            padding-left: 14px;
            margin-bottom: 4px;
        }

        .callout-list li::before {
            content: "·";
            position: absolute;
            left: 4px;
            top: 0;
            color: #FF8F00;
            font-weight: bold;
            font-size: 16px;
            line-height: 1.4;
        }

        .callout-list li strong {
            color: #E65100;
            font-weight: 600;
        }

        /* 底部按钮 */
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 375px;
            background: #fff;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
            z-index: 10;
        }

        .submit-btn {
            width: 100%;
            height: 46px;
            background: linear-gradient(135deg, #D32F2F 0%, #F44336 50%, #FFA000 100%);
            color: #fff;
            border: none;
            border-radius: 23px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
            transition: all 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-back">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <span class="nav-title">申请售后</span>
        </div>

        <!-- 内容区 -->
        <div class="content">
            <!-- 订单信息卡片 -->
            <div class="order-card">
                <div class="order-card-title">兑换订单信息</div>
                <div class="order-item">
                    <div class="order-thumb">
                        <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
                    </div>
                    <div class="order-info">
                        <div class="order-name">星巴克咖啡兑换券 中杯任选</div>
                        
                        <div class="order-bottom">
                            <span class="order-qty">x1</span>
                            <span class="order-price">
                                <span class="coin">积分 500</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 退款原因 -->
            <div class="section-card">
                <div class="section-title">退款原因<span class="required">*</span></div>
                <div class="reason-list">
                    <div class="reason-item active">
                        <div class="reason-radio"></div>
                        <div class="reason-text">优惠券-未核销未使用</div>
                        
                    </div>
                    
                    
                    <div class="reason-item" id="reasonCustom">
                        <div class="reason-radio"></div>
                        <div class="reason-text">自定义原因</div>
                    </div>
                    <input type="text" class="reason-custom-input" id="customReasonInput" placeholder="请输入退款原因" disabled>
                </div>
            </div>

            <!-- 退款规则提示 -->
            <div class="section-card">
                <div class="section-title">退款规则说明</div>
                <div class="rules-callout">
                    <div class="callout-header">
                        <div class="callout-icon">
                            <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                        </div>
                        <div class="callout-title">退款规则</div>
                    </div>
                    <ul class="callout-list">
                        <li>仅支持<strong>未核销优惠券类型</strong>礼品的退款申请</li>
                        
                    </ul>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="footer-bar">
            <button class="submit-btn">提交申请</button>
        </div>
    </div>

    <script>
        // 单选切换
        document.querySelectorAll('.reason-item').forEach(item => {
            item.addEventListener('click', function() {
                if (this.classList.contains('disabled')) return;
                document.querySelectorAll('.reason-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                // 自定义输入框启用/禁用
                var customInput = document.getElementById('customReasonInput');
                if (this.id === 'reasonCustom') {
                    customInput.disabled = false;
                    customInput.focus();
                } else {
                    customInput.disabled = true;
                    customInput.value = '';
                }
            });
        });

        // 返回按钮
        document.querySelector('.nav-back').addEventListener('click', function() {
            if (confirm('确定要离开此页面吗？')) {
                history.back();
            }
        });

        // 提交
        document.querySelector('.submit-btn').addEventListener('click', function() {
            const activeReason = document.querySelector('.reason-item.active');
            if (!activeReason) {
                alert('请选择退款原因');
                return;
            }
            alert('退款申请已提交，请耐心等待审核');
        });
    </script>
</body>
</html>
